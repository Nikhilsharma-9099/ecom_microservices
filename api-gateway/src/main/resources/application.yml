spring:
  application:
    name: api-gateway	
  
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: order
          uri: lb://order
          predicates:
            - Path=/api/orders/**, /api/cart/**

        - id: product
          uri: lb://product
          predicates:
            - Path=/api/products/**

        - id: user
          uri: lb://user
          predicates:
            - Path=/api/users/** 

server:
  port: 8080
  


management:
  endpoints:
    web:
      exposure:
        include: "*"

  tracing:
    sampling:
      probability: 1.0
 
eureka:
  instance:
     prefer-ip-address: true
     
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/     

  

  