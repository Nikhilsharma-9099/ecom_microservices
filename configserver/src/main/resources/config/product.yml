spring:
  application:
    name: product
  
  datasource:
    url: jdbc:postgresql://localhost:5432/productDB?currentSchema=public&options=-c%20timezone=Asia/Kolkata
    username: postgres
    password: postgres

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  jpa:
    database: POSTGRESQL
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata

  # h2:
  #   console:
  #     enabled: true
  # datasource:
  #   url: jdbc:h2:mem:test

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: "*"

  tracing:
    sampling:
      probability: 1.0

app:
  message: "Welcome!!"

logging:
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 5MB
      max-history: 8
