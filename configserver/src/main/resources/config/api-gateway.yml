server:
  port: 8080
  


management:
  endpoints:
    web:
      exposure:
        include: "*"

  tracing:
    sampling:
      probability: 1.0
 
eureka:
  instance:
     prefer-ip-address: true
     
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/     

  

  