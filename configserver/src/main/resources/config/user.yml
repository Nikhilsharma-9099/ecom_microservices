management:
  endpoints:
    web:
      exposure:
        include: "*"

  tracing:
      sampling:
        probability: 1.0


logging:
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 5MB
      max-history: 8