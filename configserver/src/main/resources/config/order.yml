server:
  port: 8083




spring:
  application:
    name: order
  datasource:
    url: jdbc:postgresql://localhost:5432/orderDB?currentSchema=public&options=-c%20timezone=Asia/Kolkata
    username: postgres
    password: postgres
    

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  jpa:
    database: POSTGRESQL
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata


management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
     health:
       show-details: always
  health:
     circuitbreakers:
       enabled: true

  tracing:
    sampling:
      probability: 1.0

app:
  message: "Hello Order!!"

logging:
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 5MB
      max-history: 8
      
# Circuit Breaker Configuration

resilience4j:
   circuitbreaker:
      instances:
        product:
          minimumNumberOfCalls: 5
          slidingWindowType: COUNT_BASED
          slidingWindowSize: 10
          permittedNumberOfCallsInHalfOpenState: 3
          waitDurationInOpenState: 10s
          failureRateThreshold: 50
          automaticTransitionFromOpenToHalfOpenEnabled: true
          registerHealthIndicator: true
               
      

