server:
  port: 8083




spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/orderDB?currentSchema=public&options=-c%20timezone=Asia/Kolkata
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  main:
    allow-bean-definition-overriding: false

  jpa:
    database: POSTGRESQL
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata


management:
  endpoints:
    web:
      exposure:
        include: "*"

app:
  message: "Hello Order!!"

logging:
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 5MB
      max-history: 8